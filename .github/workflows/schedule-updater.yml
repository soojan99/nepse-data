name: update-companies-data

on:
  schedule:
    # Runs at 18:45 (Nepal Time), every Monday to Friday
    - cron: "0 13,14,15,16,17 * * 0,1,2,3,4,5"
  workflow_dispatch:

defaults:
  run:
    working-directory: ./src

jobs:
  update-daily-data:
    name: update-daily-data
    runs-on: ubuntu-latest
    steps:
      # UPDATED to v4 to resolve Node.js 20 deprecation warning
      - uses: actions/checkout@v4
      
      # UPDATED to v5 to resolve Node.js 20 deprecation warning
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10" # Updated to 3.10 as 3.8 is officially EOL, but your scripts will still work perfectly
      
      - name: Install packages
        run: pip install -r requirements.txt

      # Discover newly listed companies (fixes the missing SGHL issue)
      - name: Discover new companies
        run: python discoverCompanies.py

      # Backfill historical data for any newly discovered companies
      - name: Backfill data for new companies
        run: python allDataScrapper.py

      # Update daily data for all known companies
      - name: Run daily updater
        run: python dailyDataScrapper.py

      - name: Setup Git
        run: |
          git config --local user.email "aabishkar2@gmail.com"
          git config --local user.name "Aabishkar Wagle Bot"

      - name: Commit Files
        # Added '|| echo "No changes"' to prevent workflow failure on market holidays/weekends
        run: |
          git add ../data
          git commit -m "Update data and sync new companies" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
